<aside
  class="flex-none border-r border-white/50 bg-white/70 backdrop-blur-xl flex flex-col z-10 h-screen sticky top-0 overflow-hidden transition-[width] duration-300 ease-out shadow-[0_12px_40px_rgba(15,23,42,0.08)]"
  [class.w-20]="isCollapsed()"
  [class.w-72]="!isCollapsed()"
>
  <div
    class="flex items-center py-8"
    [class.justify-center]="isCollapsed()"
    [class.px-4]="isCollapsed()"
    [class.justify-between]="!isCollapsed()"
    [class.px-8]="!isCollapsed()"
  >
    @if (isCollapsed()) {
      <div
        class="inline-flex h-11 w-11 items-center justify-center rounded-2xl bg-slate-950 text-sm font-black tracking-[0.18em] text-white"
      >
        IL
      </div>
    } @else {
      <div>
        <h1 class="text-2xl font-black tracking-tighter text-slate-950">IronLogic AI</h1>
        <p class="mt-1 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400">
          {{ isAdmin() ? 'Admin Console' : 'Athlete Portal' }}
        </p>
      </div>
    }

    <div class="flex items-center gap-2">
      <a
        routerLink="/athlete/profile"
        class="inline-flex rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
        aria-label="Open profile"
      >
        <img
          [src]="userProfile()?.profilePictureUrl || 'assets/default-avatar.png'"
          alt="User profile picture"
          class="w-10 h-10 rounded-full border border-slate-700 object-cover"
          (error)="onAvatarImageError($event)"
        />
      </a>

      <button
        type="button"
        class="text-slate-400 hover:text-slate-950 transition-colors"
        [attr.aria-label]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        (click)="toggleSidebar()"
      >
        <lucide-icon
          [name]="isCollapsed() ? 'chevron-right' : 'chevron-left'"
          class="w-4 h-4"
        ></lucide-icon>
      </button>
    </div>
  </div>

  <div class="flex-1 px-4 overflow-y-auto custom-scrollbar">
    @if (!isCollapsed()) {
      <p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-[0.25em] mb-4">
        Navigation
      </p>
    }

    <nav class="space-y-1">
      @for (item of navItems(); track item.label) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-black text-white shadow-xl shadow-black/20 active-link"
          [routerLinkActiveOptions]="{ exact: true }"
          class="group flex items-center py-3 text-sm font-bold rounded-xl transition-all duration-200 text-slate-500 hover:bg-slate-50 hover:text-slate-900"
          [class.gap-3]="!isCollapsed()"
          [class.justify-center]="isCollapsed()"
          [class.px-3]="isCollapsed()"
          [class.px-4]="!isCollapsed()"
          [attr.aria-label]="item.label"
        >
          <lucide-icon
            [name]="item.icon"
            class="w-5 h-5 opacity-70 group-hover:opacity-100"
          ></lucide-icon>

          @if (!isCollapsed()) {
            <span class="flex-1">{{ item.label }}</span>
            <lucide-icon
              name="arrow-up-right"
              class="w-4 h-4 opacity-0 transition-opacity active-arrow"
            ></lucide-icon>
          }
        </a>
      }
    </nav>
  </div>

  <div class="border-t border-slate-100 px-4 py-4">
    <button
      type="button"
      (click)="onLogout()"
      class="group flex w-full items-center rounded-xl py-3 text-sm font-bold text-slate-600 transition-all duration-200 hover:bg-red-50 hover:text-red-500"
      [class.gap-3]="!isCollapsed()"
      [class.justify-center]="isCollapsed()"
      [class.px-3]="isCollapsed()"
      [class.px-4]="!isCollapsed()"
      [attr.aria-label]="'Logout'"
    >
      <lucide-icon
        name="log-out"
        class="h-5 w-5 opacity-80 transition-opacity group-hover:opacity-100"
      ></lucide-icon>
      @if (!isCollapsed()) {
        <span class="flex-1 text-left">Logout</span>
      }
    </button>
  </div>
</aside>
