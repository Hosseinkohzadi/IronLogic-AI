<div class="lg:col-span-12 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center transition-all duration-500">

  <div class="lg:col-span-5 relative">
    <div class="relative rounded-3xl overflow-hidden border border-slate-800">
      <img [src]="testimonials[currentIndex].image"
           [alt]="testimonials[currentIndex].name"
           class="w-full h-[500px] object-cover object-top transition-all duration-500">
    </div>
  </div>

  <div class="lg:col-span-7 space-y-8">
    <div class="flex gap-1">
      @for (star of getStars(testimonials[currentIndex].stars); track $index) {
      <svg class="w-5 h-5 text-indigo-500 fill-current" viewBox="0 0 20 20">
        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
      </svg>
      }
    </div>

    <h3 class="text-2xl font-bold text-white uppercase italic">{{ testimonials[currentIndex].name }}</h3>

    <blockquote class="text-slate-400 text-xl leading-relaxed italic font-medium">
      "{{ testimonials[currentIndex].text }}"
    </blockquote>

    <div class="flex gap-4">
      <button (click)="prevSlide()"
              class="w-12 h-12 rounded-full border border-slate-800 flex items-center justify-center text-white hover:bg-indigo-600 transition-all">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <button (click)="nextSlide()"
              class="w-12 h-12 rounded-full border border-slate-800 flex items-center justify-center text-white hover:bg-indigo-600 transition-all">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>
</div>
