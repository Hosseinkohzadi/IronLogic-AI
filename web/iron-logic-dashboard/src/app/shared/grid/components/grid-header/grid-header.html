<div class="grid-header-container">

  <!-- ردیف عناوین و سورت -->
  <div class="grid-header-row">
    <div *ngFor="let col of columns"
         class="header-cell"
         [style.width]="col.width"
         [style.cursor]="col.type === 'action' || col.type === 'image' ? 'default' : 'pointer'"
         (click)="onSort(col)">

      <div *ngIf="col.type === 'selection'" class="flex justify-center items-center w-full">
        <input type="checkbox"
               (change)="onToggleAll($event)"
               class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
      </div>

      <span class="text-sm font-bold text-slate-700">{{ col.title }}</span>

      <!-- آیکون سورت (فقط برای ستون‌های مجاز) -->
      <span *ngIf="col.type !== 'action' && col.type !== 'image'"
            class="sort-icon"
            [ngClass]="{'active': col.sortOrder}">

        <!-- آیکون پیش‌فرض / صعودی -->
        <svg *ngIf="col.sortOrder !== 'desc'"
             [class.text-indigo-600]="col.sortOrder === 'asc'"
             class="w-3 h-3 -mb-1 transition-colors"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"></path>
        </svg>

        <!-- آیکون نزولی -->
        <svg *ngIf="col.sortOrder !== 'asc'"
             [class.text-indigo-600]="col.sortOrder === 'desc'"
             class="w-3 h-3 transition-colors"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path>
        </svg>

      </span>
    </div>
  </div>

  <!-- ردیف فیلترها -->
  <div class="grid-filter-row">
    <div *ngFor="let col of columns"
         class="filter-cell"
         [style.width]="col.width">

      <div *ngIf="col.type === 'selection'" class="flex justify-center text-slate-400">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>

      <!-- 1. فیلتر متنی استاندارد (برای text و flag) -->
      <input *ngIf="!col.type || col.type === 'text' || col.type === 'flag'"
             type="text"
             class="filter-input"
             [placeholder]="'جستجو ' + col.title + '...'"
             (input)="onTextInputFilter($event, col.field)"
             (click)="$event.stopPropagation()">

      <!-- 2. دراپ‌داون برای وضعیت (badge) -->
      <select *ngIf="col.type === 'badge'"
              class="filter-select"
              (change)="onSelectFilter($event, col.field)"
              (click)="$event.stopPropagation()">
        <option value="">همه وضعیت‌ها</option>
        <option value="Online">آنلاین (Online)</option>
        <option value="Offline">آفلاین (Offline)</option>
      </select>

      <!-- 3. دراپ‌داون برای امتیاز (rate) -->
      <select *ngIf="col.type === 'rate'"
              class="filter-select"
              (change)="onSelectFilter($event, col.field)"
              (click)="$event.stopPropagation()">
        <option value="">همه امتیازها</option>
        <option value="5">۵ ستاره</option>
        <option value="4">۴ ستاره</option>
        <option value="3">۳ ستاره</option>
        <option value="2">۲ ستاره</option>
        <option value="1">۱ ستاره</option>
      </select>

      <!-- 4. انتخابگر تاریخ برای تقویم (calendar) -->
      <input *ngIf="col.type === 'calendar'"
             type="date"
             class="filter-date"
             (change)="onSelectFilter($event, col.field)"
             (click)="$event.stopPropagation()">

    </div>
  </div>

</div>
