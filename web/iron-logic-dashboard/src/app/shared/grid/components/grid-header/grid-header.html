<div class="flex flex-col w-full mb-3">
  <div class="flex w-full px-2">
    <div *ngFor="let col of columns"
         class="flex items-center px-4"
         [style.width]="col.width || '150px'"
         [ngClass]="{'justify-center': col.type === 'selection', 'justify-end pr-6': col.type === 'action'}">

      <ng-container *ngIf="col.type === 'selection'">
        <input type="checkbox" (change)="onToggleAll($event)" class="w-4 h-4 rounded border-slate-300 text-black focus:ring-black cursor-pointer">
      </ng-container>

      <div *ngIf="col.type !== 'selection'" class="flex items-center gap-1.5 cursor-pointer group select-none" (click)="onSort(col)">
        <span class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.15em]">{{ col.title }}</span>
        <svg *ngIf="col.sortable" class="w-3.5 h-3.5 text-slate-300 group-hover:text-slate-500 transition-colors" [ngClass]="{'text-slate-800': col.sortOrder}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
      </div>
    </div>
  </div>
  <div *ngIf="showFilters" class="flex w-full px-2 mt-2 animate-in fade-in duration-300">
    <div *ngFor="let col of columns" class="px-2" [style.width]="col.width || '150px'">
      <ng-container *ngIf="!['selection', 'action', 'image'].includes(col.type!)">
        <div *ngIf="!col.filterType || col.filterType === 'text'" class="flex gap-1.5">
          <div class="flex-shrink-0 relative group">
            <button class="w-10 h-10 flex items-center justify-center bg-white border border-slate-100 rounded-lg text-slate-500 hover:bg-slate-50 focus:border-indigo-300 outline-none transition-all shadow-sm"
                    [title]="getTextOperatorLabel(getTextOperator(col.field))">
              <lucide-icon [name]="getTextOperatorIcon(getTextOperator(col.field))" class="w-4 h-4"></lucide-icon>
            </button>
            <div class="hidden group-hover:flex absolute left-0 top-full mt-1.5 flex-col bg-white border border-slate-100 rounded-lg shadow-lg py-1 z-50">
              <button (click)="onTextOperatorChange(col.field, 'contains')" 
                      class="flex items-center gap-2 px-3 py-2 text-[11px] font-medium text-slate-600 hover:bg-indigo-50 whitespace-nowrap"
                      [ngClass]="{'bg-indigo-50 text-indigo-700': getTextOperator(col.field) === 'contains'}">
                <lucide-icon name="search" class="w-3.5 h-3.5"></lucide-icon>
                Contains
              </button>
              <button (click)="onTextOperatorChange(col.field, 'notContains')" 
                      class="flex items-center gap-2 px-3 py-2 text-[11px] font-medium text-slate-600 hover:bg-indigo-50 whitespace-nowrap"
                      [ngClass]="{'bg-indigo-50 text-indigo-700': getTextOperator(col.field) === 'notContains'}">
                <lucide-icon name="x" class="w-3.5 h-3.5"></lucide-icon>
                Not Contains
              </button>
              <button (click)="onTextOperatorChange(col.field, 'startsWith')" 
                      class="flex items-center gap-2 px-3 py-2 text-[11px] font-medium text-slate-600 hover:bg-indigo-50 whitespace-nowrap"
                      [ngClass]="{'bg-indigo-50 text-indigo-700': getTextOperator(col.field) === 'startsWith'}">
                <lucide-icon name="chevron-right" class="w-3.5 h-3.5"></lucide-icon>
                Starts With
              </button>
              <button (click)="onTextOperatorChange(col.field, 'endsWith')" 
                      class="flex items-center gap-2 px-3 py-2 text-[11px] font-medium text-slate-600 hover:bg-indigo-50 whitespace-nowrap"
                      [ngClass]="{'bg-indigo-50 text-indigo-700': getTextOperator(col.field) === 'endsWith'}">
                <lucide-icon name="chevron-left" class="w-3.5 h-3.5"></lucide-icon>
                Ends With
              </button>
              <button (click)="onTextOperatorChange(col.field, 'equals')" 
                      class="flex items-center gap-2 px-3 py-2 text-[11px] font-medium text-slate-600 hover:bg-indigo-50 whitespace-nowrap"
                      [ngClass]="{'bg-indigo-50 text-indigo-700': getTextOperator(col.field) === 'equals'}">
                <lucide-icon name="check" class="w-3.5 h-3.5"></lucide-icon>
                Equals
              </button>
            </div>
          </div>
          <input type="text"
                 [value]="textFilterValues[col.field] || ''"
                 [placeholder]="'Filter ' + col.title + '...'"
                 (input)="onTextInputFilter($event, col.field)"
                 class="flex-1 bg-white border border-slate-100 rounded-lg py-1.5 px-3 text-[11px] font-medium text-slate-600 focus:border-indigo-300 outline-none transition-all placeholder:text-slate-300 shadow-sm">
        </div>

        <select *ngIf="col.filterType === 'select'"
          [value]="selectFilterValues[col.field] || ''"
                (change)="onSelectFilter($event, col.field)"
                class="w-full bg-white border border-slate-100 rounded-lg py-1.5 px-3 text-[11px] font-medium text-slate-600 focus:border-indigo-300 outline-none transition-all shadow-sm">
          <option value="">All</option>
          <option *ngFor="let option of col.filterOptions || []" [value]="option.value">{{ option.label }}</option>
        </select>

        <div *ngIf="col.filterType === 'date'" class="space-y-1.5">
          <select
            [value]="getDateMode(col.field, col.filterMode)"
            (change)="onDateModeChange($event, col.field)"
            class="w-full bg-white border border-slate-100 rounded-lg py-1.5 px-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider focus:border-indigo-300 outline-none transition-all shadow-sm">
            <option value="exact">Exact date</option>
            <option value="range">Date range</option>
          </select>

          <input *ngIf="getDateMode(col.field, col.filterMode) === 'exact'"
                 type="date"
               [value]="dateExact[col.field] || ''"
                 (change)="onDateExactChange($event, col.field)"
                 class="w-full bg-white border border-slate-100 rounded-lg py-1.5 px-2 text-[11px] font-medium text-slate-600 focus:border-indigo-300 outline-none transition-all shadow-sm">

          <div *ngIf="getDateMode(col.field, col.filterMode) === 'range'" class="grid grid-cols-1 gap-1.5">
            <input type="date"
                 [value]="dateFrom[col.field] || ''"
                   (change)="onDateFromChange($event, col.field)"
                   class="w-full bg-white border border-slate-100 rounded-lg py-1.5 px-2 text-[11px] font-medium text-slate-600 focus:border-indigo-300 outline-none transition-all shadow-sm">
            <input type="date"
                 [value]="dateTo[col.field] || ''"
                   (change)="onDateToChange($event, col.field)"
                   class="w-full bg-white border border-slate-100 rounded-lg py-1.5 px-2 text-[11px] font-medium text-slate-600 focus:border-indigo-300 outline-none transition-all shadow-sm">
          </div>
        </div>

        <div *ngIf="col.filterType === 'number'" class="space-y-1.5">
          <select
            [value]="getNumberMode(col.field, col.filterMode)"
            (change)="onNumberModeChange($event, col.field)"
            class="w-full bg-white border border-slate-100 rounded-lg py-1.5 px-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider focus:border-indigo-300 outline-none transition-all shadow-sm">
            <option value="compare">Compare</option>
            <option value="range">Range</option>
          </select>

          <div *ngIf="getNumberMode(col.field, col.filterMode) === 'compare'" class="grid grid-cols-2 gap-1.5">
            <select
              [value]="getNumberOperator(col.field)"
              (change)="onNumberOperatorChange($event, col.field)"
              class="w-full bg-white border border-slate-100 rounded-lg py-1.5 px-2 text-[11px] font-medium text-slate-600 focus:border-indigo-300 outline-none transition-all shadow-sm">
              <option value="eq">=</option>
              <option value="gt">&gt;</option>
              <option value="gte">&gt;=</option>
              <option value="lt">&lt;</option>
              <option value="lte">&lt;=</option>
            </select>
            <input type="number"
                   [value]="numberValue[col.field] ?? ''"
                   (input)="onNumberValueChange($event, col.field)"
                   class="w-full bg-white border border-slate-100 rounded-lg py-1.5 px-2 text-[11px] font-medium text-slate-600 focus:border-indigo-300 outline-none transition-all shadow-sm">
          </div>

          <div *ngIf="getNumberMode(col.field, col.filterMode) === 'range'" class="grid grid-cols-2 gap-1.5">
            <input type="number"
                   [value]="numberMin[col.field] ?? ''"
                   (input)="onNumberMinChange($event, col.field)"
                   placeholder="Min"
                   class="w-full bg-white border border-slate-100 rounded-lg py-1.5 px-2 text-[11px] font-medium text-slate-600 focus:border-indigo-300 outline-none transition-all placeholder:text-slate-300 shadow-sm">
            <input type="number"
                   [value]="numberMax[col.field] ?? ''"
                   (input)="onNumberMaxChange($event, col.field)"
                   placeholder="Max"
                   class="w-full bg-white border border-slate-100 rounded-lg py-1.5 px-2 text-[11px] font-medium text-slate-600 focus:border-indigo-300 outline-none transition-all placeholder:text-slate-300 shadow-sm">
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
