<div
  class="grid-container flex h-full min-h-0 w-full flex-col gap-2 overflow-hidden"
>
  <div class="mb-4 flex w-full items-center justify-between shrink-0">
    <div
      *ngIf="showSearch"
      class="h-9 w-full max-w-[400px] border border-slate-200 rounded-lg shadow-sm bg-white overflow-hidden flex items-center"
    >
      <div
        class="flex h-full items-center justify-center border-r border-slate-200 px-2.5 text-slate-500"
      >
        <lucide-icon name="search" class="w-4 h-4"></lucide-icon>
      </div>
      <input
        type="text"
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchTermChange($event)"
        placeholder="Search current view..."
        class="h-full flex-1 bg-transparent outline-none border-0 px-3 text-[11px] font-medium text-slate-600 placeholder:text-slate-300"
      />
    </div>

    <div class="flex items-center gap-2">
      <ng-container *ngIf="showExport">
        <button
          (click)="export('excel')"
          class="flex items-center gap-2 px-4 py-2.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold rounded-[12px] transition-all whitespace-nowrap border border-emerald-100"
        >
          <lucide-icon name="file-spreadsheet" class="w-4 h-4"></lucide-icon> Excel
        </button>
        <button
          (click)="export('pdf')"
          class="flex items-center gap-2 px-4 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold rounded-[12px] transition-all whitespace-nowrap border border-rose-100"
        >
          <lucide-icon name="file-text" class="w-4 h-4"></lucide-icon> PDF
        </button>
      </ng-container>

      <button
        (click)="handleRefresh()"
        class="flex items-center gap-2 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-[12px] transition-all whitespace-nowrap"
      >
        <lucide-icon
          name="refresh-cw"
          [class.animate-spin]="isLoading"
          class="w-4 h-4"
        ></lucide-icon>
        Refresh
      </button>

      <div class="w-px h-6 bg-slate-200 mx-1"></div>

      <div class="relative" #columnMenuContainer>
        <button
          (click)="isColumnMenuOpen = !isColumnMenuOpen"
          class="px-3 py-2 flex items-center gap-2 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition-all shadow-sm focus:outline-none"
        >
          <lucide-icon name="sliders-horizontal" class="w-4 h-4 text-slate-600"></lucide-icon>
          <span
            class="bg-slate-100 text-slate-600 rounded-md px-1.5 py-0.5 text-[11px] font-bold tracking-wide"
            >{{ visibleColumns.length }}/{{ columns.length }}</span
          >
        </button>

        <div
          *ngIf="isColumnMenuOpen"
          class="absolute right-0 top-full mt-1 w-56 bg-white border border-slate-200 rounded-lg shadow-lg z-[100] py-2 font-sans"
        >
          <button
            (click)="autoSizeColumnsContentBased()"
            class="w-full flex items-center justify-start gap-3 px-3 py-2 hover:bg-slate-50 transition-colors text-sm text-slate-700 font-medium cursor-pointer border-b border-slate-100"
          >
            <lucide-icon name="sliders-horizontal" class="w-4 h-4 text-slate-400"></lucide-icon>
            <span class="truncate">Auto size all columns</span>
          </button>
          <label
            *ngFor="let col of toggleableColumns"
            class="flex items-center gap-2.5 px-3 py-2 hover:bg-slate-50 rounded-md cursor-pointer transition-colors select-none"
          >
            <input
              type="checkbox"
              [checked]="!col.hidden"
              (change)="toggleColumn(col)"
              class="w-3.5 h-3.5 rounded border-slate-300 text-indigo-500 focus:ring-indigo-500/20 cursor-pointer mt-0.5 accent-indigo-500"
            />
            <div class="flex items-center flex-1 gap-2">
              <lucide-icon
                *ngIf="col.icon"
                [name]="col.icon"
                class="w-3.5 h-3.5 text-slate-400 shrink-0"
              ></lucide-icon>
              <div class="flex flex-col min-w-0 flex-1">
                <span class="text-[11px] font-bold text-slate-600 tracking-wider uppercase">
                  {{ col.title || col.field }}
                </span>
                <span *ngIf="shouldShowColumnField(col)" class="text-[9px] text-slate-400 mt-0.5">{{
                  col.field
                }}</span>
              </div>
              <div class="flex items-center gap-1.5">
                <lucide-icon
                  *ngIf="isColumnFiltered(col.field)"
                  name="filter"
                  class="w-3 h-3 text-indigo-500"
                ></lucide-icon>
                <span
                  *ngIf="col.sortOrder"
                  class="flex items-center justify-center w-4 h-4 bg-indigo-50/80 text-indigo-700 border border-indigo-100 rounded text-[10px] font-bold"
                >
                  {{ col.sortOrder === 'asc' ? '↑' : '↓' }}
                </span>
              </div>
            </div>
          </label>
        </div>
      </div>
    </div>
  </div>

  <ng-template #paginationTemplate>
    <app-grid-footer
      *ngIf="pagination$ | async as pg"
      [pagination]="pg"
      (pageChange)="gridDataService.goToPage($event)"
      (pageSizeChange)="onPageSizeChange($event)"
    >
    </app-grid-footer>
  </ng-template>

  <div
    *ngIf="pagerPosition === 'top' || pagerPosition === 'both'"
    class="border-b border-slate-200"
  >
    <ng-container *ngTemplateOutlet="paginationTemplate"></ng-container>
  </div>

  <div
    #gridScrollContainer
    class="relative min-h-0 flex-1 w-full overflow-auto custom-scrollbar border border-slate-200 rounded-2xl"
    [class.fit-viewport-scroll]="isFitViewportMode"
    style="overflow-x: auto !important; display: block !important"
  >
    <app-grid-header
      [columns]="visibleColumns"
      [fitViewportMode]="isFitViewportMode"
      [style.display]="'contents'"
      [showFilters]="showFilters"
      [filterResetKey]="filterResetKey"
      [reorderable]="reorderable()"
      (sortChange)="gridDataService.applySorts($event)"
      (filterChange)="gridDataService.updateFilter($event)"
      (toggleAll)="gridDataService.toggleAllSelection($event)"
      (columnDrop)="drop($event)"
    >
    </app-grid-header>

    <app-grid-body
      [columns]="visibleColumns"
      [fitViewportMode]="isFitViewportMode"
      [resizableRows]="resizableRows"
      [style.display]="'contents'"
      [data$]="pagedData$"
      [editSettings]="editSettings"
      (action)="actionTriggered.emit($event)"
      (rowResize)="onRowResize()"
      (saveChanges)="saveChanges.emit($event)"
      (inlineSave)="inlineSave.emit($event)"
    >
    </app-grid-body>
  </div>

  <div
    *ngIf="pagerPosition === 'bottom' || pagerPosition === 'both'"
    class="border-t border-slate-200"
  >
    <ng-container *ngTemplateOutlet="paginationTemplate"></ng-container>
  </div>
</div>
