<div class="p-8 bg-slate-50 min-height-screen">
  <div class="flex justify-between items-center mb-10">
    <h1 class="text-3xl font-black text-slate-800 tracking-tight">Admin Control Center</h1>
    <div class="relative w-72">
      <span class="absolute inset-y-0 left-3 flex items-center text-slate-400">🔍</span>
      <input type="text" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)"
             class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-sm"
             placeholder="Search exercises...">
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Total Exercises</p>
      <p class="text-4xl font-black text-slate-800">{{ api.totalExercises() }}</p>
    </div>
    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">System Status</p>
      <div class="flex items-center gap-2">
        <span class="flex h-3 w-3 rounded-full bg-emerald-500"></span>
        <p class="text-xl font-bold text-slate-700">Healthy</p>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
    <div class="p-6 border-b border-slate-50 flex justify-between items-center bg-slate-50/50">
      <h2 class="text-lg font-bold text-slate-800">Exercise Library</h2>
      <button
        class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold text-sm hover:bg-indigo-700 shadow-lg shadow-indigo-200">
        Add New
      </button>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
        <tr class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
          <th class="px-8 py-4">Name</th>
          <th class="px-8 py-4">Mechanics</th>
          <th class="px-8 py-4 text-right">Actions</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-slate-50">
        <tr *ngFor="let ex of filteredExercises()" class="group hover:bg-slate-50/80 transition-colors">
          <td class="px-8 py-5 font-bold text-slate-700">{{ ex.name }}</td>
          <td class="px-8 py-5 text-sm text-slate-500">{{ ex.mechanics || 'None' }}</td>
          <td class="px-8 py-5 text-right space-x-4">
            <button class="text-sm font-bold text-slate-400 hover:text-indigo-600">Edit</button>
            <button (click)="onDelete(ex.id)" class="text-sm font-bold text-slate-400 hover:text-red-500">Delete
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="p-4 bg-white border-t border-slate-100 flex items-center justify-between">
      <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">
        Page {{ currentPage() }}
      </span>
      <div class="flex gap-2">
        <button (click)="changePage(-1)"
                [disabled]="currentPage() === 1"
                class="px-4 py-2 text-xs font-bold rounded-lg border border-slate-200 disabled:opacity-50 hover:bg-slate-50 transition-all">
          Previous
        </button>
        <button (click)="changePage(1)"
                [disabled]="filteredExercises().length < pageSize"
                class="px-4 py-2 text-xs font-bold rounded-lg bg-slate-800 text-white hover:bg-slate-900 transition-all">
          Next
        </button>
      </div>
    </div>
  </div>
</div>
