<div class="calendar-card rounded-[2.5rem] p-6 border border-slate-50">

  <div class="flex justify-between items-center mb-6">
    <h3 class="text-lg font-black text-slate-800 tracking-tight">{{ monthName() }}</h3>
    <div class="flex gap-1">
      <button (click)="prevMonth()" class="nav-btn">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button (click)="nextMonth()" class="nav-btn">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <div class="calendar-header grid grid-cols-7 mb-4">
    @for (day of weekDays; track $index) {
    <div class="text-slate-400 font-bold text-[10px] uppercase text-center">{{ day }}</div>
    }
  </div>

  <div class="calendar-grid grid grid-cols-7 gap-2">
    @for (day of calendarDays(); track day.date.getTime()) {
    <div class="calendar-cell group relative aspect-square flex items-center justify-center rounded-2xl text-xs font-bold transition-all duration-300"
         [class.bg-indigo-600]="day.isToday"
         [class.text-white]="day.isToday"
         [class.today-pulse]="day.isToday"
         [class.shadow-md]="day.isToday"
         [class.bg-indigo-50]="day.hasWorkout && !day.isToday"
         [class.text-indigo-600]="day.hasWorkout && !day.isToday"
         [class.text-slate-900]="!day.hasWorkout && !day.isAdjacentMonth && !day.isToday"
         [class.text-slate-300]="day.isAdjacentMonth && !day.isToday">

    {{ day.date | date:'d' }}

    @if (day.hasWorkout) {
    <div class="absolute bottom-1.5 w-1 h-1 rounded-full"
         [class.bg-indigo-600]="!day.isToday"
         [class.bg-white]="day.isToday"></div>

    <div class="invisible group-hover:visible absolute bottom-full mb-3 z-[100] w-48 p-3 bg-slate-900/95 backdrop-blur-md text-white rounded-2xl shadow-2xl pointer-events-none border border-slate-700/50 transform transition-all duration-200">
      <div class="text-[10px] uppercase tracking-widest text-slate-400 font-black mb-2 border-b border-slate-700/50 pb-1">
        Workouts
      </div>
      @for (s of day.sessions; track $index) {
      <div class="mb-2 last:mb-0">
        <p class="text-indigo-400 font-bold leading-tight">{{ s.title }}</p>
              <p class="text-[10px] text-slate-300">{{ s.duration }}</p>
            </div>
      }
      <div class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-slate-900"></div>
    </div>
    }
    </div>
    }
  </div>

  <div class="mt-6 flex items-center gap-4 px-2">
    <div class="flex items-center gap-2">
      <div class="w-2 h-2 bg-indigo-500 rounded-full shadow-[0_0_8px_rgba(79,70,229,0.4)]"></div>
      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-tight">Workout Day</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
      <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tight">Rest Day</span>
    </div>
  </div>
</div>
