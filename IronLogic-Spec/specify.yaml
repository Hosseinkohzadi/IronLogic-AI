# specify.yaml
project:
  name: IronLogic AI
  language: csharp
  framework: net10.0 
  structure: clean-architecture
  
specifications:
  - path: openapi.yaml
    type: openapi

generators:
  - name: csharp-controllers
    output: ../src/IronLogic.Api/Controllers
  - name: csharp-models
    output: ../src/IronLogic.Application/DTOs
  - name: angular-services
    output: ../web/iron-logic-dashboard/src/app/core/services
  - name: angular-models
    output: ../web/iron-logic-dashboard/src/app/core/models

coding_standards:
  testing:
    framework: "xUnit"
    mocking_library: "Moq"
    assertion_library: "FluentAssertions"
    pattern: "AAA"
    required: true
    location: "tests/IronLogic.Tests.Unit"