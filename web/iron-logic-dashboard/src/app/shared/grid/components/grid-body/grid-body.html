<div class="flex flex-col gap-3 w-full">
  <div *ngFor="let row of data$ | async"
       class="flex items-center w-full bg-white border border-slate-100 rounded-xl hover:border-slate-300 hover:shadow-md transition-all cursor-pointer px-2 py-2"
       [class.ring-1]="row.isSelected"
       [class.ring-slate-300]="row.isSelected"
       [class.bg-slate-50]="row.isSelected"
       (click)="onRowClick(row)">

    <div *ngFor="let col of columns"
         class="flex items-center px-4 overflow-hidden whitespace-nowrap"
         [style.width]="col.width || '150px'"
         [ngClass]="{'justify-center': col.type === 'selection', 'justify-end pr-4': col.type === 'action'}">

      <ng-container *ngIf="col.type === 'selection'">
        <input type="checkbox" [(ngModel)]="row.isSelected" (change)="onRowSelect(row)" (click)="$event.stopPropagation()" class="w-4 h-4 rounded border-slate-300 text-black focus:ring-black cursor-pointer">
      </ng-container>

      <ng-container *ngIf="!col.type || col.type === 'text'">
        <span class="text-[13px] text-slate-600 font-medium">{{ row[col.field] }}</span>
      </ng-container>

      <ng-container *ngIf="col.type === 'profile'">
        <div class="flex flex-col">
          <span class="font-bold text-slate-900 text-[13px]">{{ row[col.field] }}</span>
          <span class="text-[11px] font-medium text-slate-400 mt-0.5">USR-{{ row['id'] | slice:0:4 }}</span>
        </div>
      </ng-container>

      <ng-container *ngIf="col.type === 'badge'">
        <span class="inline-flex items-center rounded-md px-3 py-1 text-[11px] font-medium"
              [ngClass]="{
                'bg-emerald-100 text-emerald-700': row[col.field] === 'Active',
                'bg-amber-100 text-amber-700': row[col.field] === 'Review',
                'bg-rose-100 text-rose-700': row[col.field] === 'Suspended'
              }">
          {{ row[col.field] }}
        </span>
      </ng-container>

      <ng-container *ngIf="col.type === 'tier'">
        <span class="inline-flex items-center rounded-md px-3 py-1 text-[11px] font-bold tracking-tight uppercase"
              [ngClass]="{
                'bg-indigo-50 text-indigo-700 ring-1 ring-inset ring-indigo-200': row[col.field] === 'Elite' || row[col.field] === 'Premium',
                'bg-blue-50 text-blue-700 ring-1 ring-inset ring-blue-200': row[col.field] === 'Pro',
                'bg-slate-100 text-slate-600 ring-1 ring-inset ring-slate-200': row[col.field] === 'Basic' || row[col.field] === 'Free'
              }">
          {{ row[col.field] }}
        </span>
      </ng-container>

      <ng-container *ngIf="col.type === 'email'">
        <div class="flex items-center gap-2">
          <svg *ngIf="row['status'] !== 'Suspended'" class="w-4 h-4 text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7l6.2 4.65a3 3 0 003.6 0L20 7"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
          <svg *ngIf="row['status'] === 'Suspended'" class="w-4 h-4 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="text-[13px] text-slate-600 font-medium">{{ row[col.field] }}</span>
        </div>
      </ng-container>

      <ng-container *ngIf="col.type === 'action' || col.field === 'actions'">
        <button (click)="onAction('edit', row, $event)" class="p-1 text-slate-400 hover:text-slate-700 transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        </button>
      </ng-container>

    </div>
  </div>

  <div *ngIf="(data$ | async)?.length === 0" class="p-12 text-center text-[12px] font-bold text-slate-400">
    No records found.
  </div>
</div>
