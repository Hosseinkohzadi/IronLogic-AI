openapi: 3.0.3
info:
  title: IronLogic AI - Bodybuilding Progress Tracker
  description: API for tracking daily weight and muscle measurements for bodybuilding athletes.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server

paths:
  /progress/weight:
    post:
      summary: Log daily weight
      tags:
        - Progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyWeight'
      responses:
        '201':
          description: Weight logged successfully
  
  /progress/measurements:
    post:
      summary: Log muscle measurements
      tags:
        - Progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuscleMeasurement'
      responses:
        '201':
          description: Measurements logged successfully

components:
  schemas:
    DailyWeight:
      type: object
      required:
        - date
        - weight
      properties:
        date:
          type: string
          format: date
          example: "2026-03-24"
        weight:
          type: number
          format: float
          minimum: 40
          maximum: 200
          description: Weight in kilograms (kg)
          example: 85.5
        note:
          type: string
          maxLength: 200

    MuscleMeasurement:
      type: object
      required:
        - date
        - neck
        - chest
        - waist
      properties:
        date:
          type: string
          format: date
        neck:
          type: number
          format: float
          minimum: 20
          maximum: 60
          description: Neck circumference in cm
        chest:
          type: number
          format: float
          minimum: 50
          maximum: 180
          description: Chest circumference in cm
        waist:
          type: number
          format: float
          minimum: 40
          maximum: 150
          description: Waist circumference in cm (Crucial for Classic Physique ratio)
        biceps_left:
          type: number
          format: float
        biceps_right:
          type: number
          format: float
        thigh_left:
          type: number
          format: float
        thigh_right:
          type: number
          format: float