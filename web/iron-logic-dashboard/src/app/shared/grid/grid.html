<div class="flex flex-col w-full gap-2">

  <div class="flex flex-col xl:flex-row justify-between items-center gap-4 mb-4">

    <div *ngIf="showSearch" class="h-9 w-full xl:w-[400px] border border-slate-200 rounded-lg shadow-sm bg-white overflow-hidden flex items-center">
      <div class="flex h-full items-center justify-center border-r border-slate-200 px-2.5 text-slate-500">
        <lucide-icon name="search" class="w-4 h-4"></lucide-icon>
      </div>
      <input type="text"
             [ngModel]="searchTerm" (ngModelChange)="search.emit($event)"
             placeholder="Search current view..."
             class="h-full flex-1 bg-transparent outline-none border-0 px-3 text-[11px] font-medium text-slate-600 placeholder:text-slate-300">
    </div>

    <div class="flex items-center gap-2 overflow-x-auto w-full xl:w-auto pb-2 xl:pb-0">

      <ng-container *ngIf="showExport">
        <button (click)="export('excel')" class="flex items-center gap-2 px-4 py-2.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold rounded-[12px] transition-all whitespace-nowrap border border-emerald-100">
          <lucide-icon name="file-spreadsheet" class="w-4 h-4"></lucide-icon> Excel
        </button>
        <button (click)="export('pdf')" class="flex items-center gap-2 px-4 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold rounded-[12px] transition-all whitespace-nowrap border border-rose-100">
          <lucide-icon name="file-text" class="w-4 h-4"></lucide-icon> PDF
        </button>
      </ng-container>

      <button (click)="onRefreshClick()" class="flex items-center gap-2 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-[12px] transition-all whitespace-nowrap">
        <lucide-icon name="refresh-cw" [class.animate-spin]="isLoading" class="w-4 h-4"></lucide-icon> Refresh
      </button>

      <div class="hidden md:flex items-center gap-2 ml-2 border-l border-slate-200 pl-4">
        <span class="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-[11px] font-bold text-slate-600">{{ (gridDataService.processedData$ | async)?.length || 0 }} matched</span>
      </div>
    </div>
  </div>

  <app-grid-header [columns]="columns"
                   [showFilters]="showFilters"
                   [filterResetKey]="filterResetKey"
                   (sortChange)="gridDataService.applySort($event.field, $event.sortOrder!)"
                   (filterChange)="gridDataService.updateFilter($event)"
                   (toggleAll)="gridDataService.toggleAllSelection($event)">
  </app-grid-header>

  <app-grid-body [columns]="columns"
                 [data$]="gridDataService.pagedData$"
                 [editSettings]="editSettings"
                 (action)="actionTriggered.emit($event)"
                 (saveChanges)="saveChanges.emit($event)"
                 (inlineSave)="inlineSave.emit($event)">
  </app-grid-body>

  <app-grid-footer *ngIf="gridDataService.pagination$ | async as pg" [pagination]="pg" (pageChange)="gridDataService.goToPage($event)"></app-grid-footer>

</div>
