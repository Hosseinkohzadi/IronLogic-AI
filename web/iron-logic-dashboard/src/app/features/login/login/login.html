<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div
    class="w-full max-w-6xl h-[700px] bg-white rounded-[3rem] shadow-2xl border border-slate-100 flex overflow-hidden">

    <div class="w-1/2 relative p-12 flex flex-col justify-between hidden lg:flex">
      <div class="absolute inset-0 bg-cover bg-center"
           style="background-image: url('public/assets/unsplash-EhTcC9sYXsw.jpg');">
        <div class="absolute inset-0 bg-indigo-950/70 backdrop-blur-sm"></div>
      </div>

      <div class="relative z-10">
        <img src="../../../../../public/assets/logo-white.svg" alt="IronLogic Logo" class="h-10 mb-20">
        <h1 class="text-6xl font-black text-white leading-tight tracking-tighter">
          Welcome to<br>IronLogic<br>Dashboard
        </h1>
      </div>

      <div class="relative z-10 text-indigo-100 text-xs font-bold uppercase tracking-widest">
        © 2026 IronLogic AI. All rights reserved.
      </div>
    </div>

    <div class="w-full lg:w-1/2 p-10 sm:p-20 flex flex-col justify-center">
      <div class="max-w-md mx-auto w-full">

        <h2 class="text-4xl font-black text-slate-950 mb-4 tracking-tighter">Login Here</h2>
        <p class="text-slate-500 mb-12">Login to manage your workout stats and coach AI advice.</p>

        <form class="flex flex-col gap-6 mb-8" (submit)="$event.preventDefault()">
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round"
                                                                                               stroke-linejoin="round"
                                                                                               stroke-width="2"
                                                                                               d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </span>
            <input type="text" placeholder="Username or Email"
                   class="w-full pl-12 pr-4 py-3 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all text-sm">
          </div>

          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round"
                                                                                               stroke-linejoin="round"
                                                                                               stroke-width="2"
                                                                                               d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </span>
            <input type="password" placeholder="Password"
                   class="w-full pl-12 pr-4 py-3 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all text-sm">
          </div>

          <div class="text-right -mt-2">
            <a routerLink="/forgot" class="text-xs font-bold text-slate-500 hover:text-indigo-600 transition-colors">Forgot
              Password?</a>
          </div>

          <button type="submit"
                  class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-sm shadow-indigo-600/30 transition-all border border-transparent active:scale-95">
            Log In
          </button>
        </form>

        <div class="relative mb-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200"></div>
          </div>
          <div class="relative flex justify-center text-xs uppercase"><span
            class="bg-white px-2 text-slate-400 font-bold tracking-tight">Or login with</span></div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-10">
          <button class="flex items-center justify-center gap-3 py-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition-all active:scale-95">
            <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <span class="text-sm font-bold text-slate-700">Google</span>
          </button>

          <button class="flex items-center justify-center gap-3 py-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition-all active:scale-95">
            <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" fill="#1877F2"/>
            </svg>
            <span class="text-sm font-bold text-slate-700">Facebook</span>
          </button>
        </div>

        <div class="text-center text-xs text-slate-500 font-bold uppercase tracking-tight">
          Don't have an account? <a routerLink="/register" class="text-indigo-600 hover:text-indigo-700">Sign Up</a>
        </div>

      </div>
    </div>

  </div>
</div>
