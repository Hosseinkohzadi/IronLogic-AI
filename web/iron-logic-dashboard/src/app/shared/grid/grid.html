<div class="iron-grid">
  <app-grid-header
    [columns]="columns"
    (sortChange)="gridDataService.applyChanges($event.field, $event.sortOrder!)">
  </app-grid-header>

  <app-grid-body
    [columns]="columns"
    [data$]="gridDataService.pagedData$">
  </app-grid-body>

  <app-grid-footer
    *ngIf="gridDataService.pagination$ | async as pg"
    [pagination]="pg"
    (pageChange)="gridDataService.goToPage($event)">
  </app-grid-footer>
</div>
