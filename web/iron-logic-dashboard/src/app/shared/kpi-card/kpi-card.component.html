<div
  class="p-6 rounded-[1.5rem] border transition-all hover:shadow-md flex flex-col h-full group"
  [ngStyle]="containerStyles()"
  [class.cursor-pointer]="actionType() !== 'none'"
  (click)="handleClick()">
  <!-- Header: Label and Icons (always visible) -->
  <div class="flex items-center justify-between">
    <!-- Label -->
    <span class="text-[10px] font-black uppercase tracking-widest mt-1" [ngClass]="labelClass() || themeStyles().labelText">
      {{ label() }}
    </span>

    <!-- Icons Container -->
    <div class="flex items-center gap-2">
      <!-- Main Icon -->
      <div class="p-2.5 transition-colors rounded-[14px]" [ngClass]="[themeStyles().iconBg, themeStyles().iconHover, themeStyles().iconText]">
        <lucide-icon [name]="mainIcon()" class="w-5 h-5"></lucide-icon>
      </div>

      <!-- Info Icon & Popover (Conditional) -->
      @if (showInfoIcon()) {
        <div class="relative group/info">
          <!-- Info Icon (Standardized with Main Icon Geometry) -->
          <div class="p-2.5 transition-colors rounded-[14px]" [ngClass]="[infoIconTheme().bg, infoIconTheme().text, infoIconTheme().hover]">
            <lucide-icon name="info" class="w-5 h-5"></lucide-icon>
          </div>

          <!-- Hover Popover (Smart Positioning + Polish) -->
          <div
            class="absolute top-full right-0 mt-2 w-72 p-5 bg-slate-900 rounded-xl shadow-xl z-[100] opacity-0 scale-95 origin-top-right group-hover/info:opacity-100 group-hover/info:scale-100 invisible group-hover/info:visible transition-all duration-200 pointer-events-none group-hover/info:pointer-events-auto">
            <p class="text-xs font-medium text-white">
              {{ infoText() }}
            </p>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Default Content (Value, Trend, Context) -->
  @if (!useCustomContent()) {
    <!-- Value -->
    <h3 class="text-[32px] font-black mt-2 tracking-tight" [ngClass]="valueClass() || themeStyles().valueText">
      {{ value() }}
    </h3>

    <!-- Footer: Trend and Context -->
    <div class="flex items-center justify-between mt-4">
      <!-- Trend -->
      <span
        class="text-xs font-bold"
        [class.text-emerald-600]="trend().startsWith('+')"
        [class.text-rose-600]="trend().startsWith('-')">
        {{ trend() }}
      </span>

      <!-- Context -->
      <span class="text-[11px] font-medium" [ngClass]="themeStyles().contextText">
        {{ context() }}
      </span>
    </div>
  }

  <!-- Custom Content Slot -->
  @if (useCustomContent()) {
    <div class="flex-1 min-h-0 mt-2 animate-fade-in">
      <ng-content></ng-content>
    </div>
  }
</div>
