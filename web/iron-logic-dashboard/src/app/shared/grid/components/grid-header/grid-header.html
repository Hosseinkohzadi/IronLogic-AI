<div class="grid-header-container">
  <div class="grid-header-row"
       cdkDropList
       cdkDropListOrientation="horizontal"
       (cdkDropListDropped)="onColumnDrop($event)">

    <div *ngFor="let col of columns"
         class="header-cell"
         [ngClass]="{
            'col-selection': col.type === 'selection',
            'col-avatar': col.type === 'image' || col.field === 'avatar',
            'col-action': col.type === 'action' || col.field === 'actions'
         }"
         cdkDrag
         [cdkDragDisabled]="['selection', 'action', 'image'].includes(col.type!) || col.field === 'avatar'"
         [style.width]="col.width || '150px'">

      <div *cdkDragPlaceholder class="drag-placeholder"></div>

      <ng-container *ngIf="col.type === 'selection'">
        <input type="checkbox" (change)="onToggleAll($event)" class="cursor-pointer">
      </ng-container>

      <span class="text-sm font-bold text-slate-700 truncate"
            (click)="onSort(col)"
            [style.cursor]="['action', 'selection', 'image'].includes(col.type!) ? 'default' : 'pointer'">
        {{ col.title }}
      </span>

      <span *ngIf="!['action', 'selection', 'image'].includes(col.type!) && col.field !== 'avatar'"
            class="sort-icon flex flex-col items-center opacity-40 hover:opacity-100 transition-opacity"
            [ngClass]="{'opacity-100': col.sortOrder}">

        <svg *ngIf="col.sortOrder !== 'desc'"
             [class.text-indigo-600]="col.sortOrder === 'asc'"
             [class.text-slate-400]="!col.sortOrder"
             class="w-3 h-3 -mb-1 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"></path>
        </svg>

        <svg *ngIf="col.sortOrder !== 'asc'"
             [class.text-indigo-600]="col.sortOrder === 'desc'"
             [class.text-slate-400]="!col.sortOrder"
             class="w-3 h-3 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path>
        </svg>
      </span>

      <div *ngIf="!['selection', 'action', 'image'].includes(col.type!) && col.field !== 'avatar'"
           class="resizer"
           (mousedown)="onResizeStart($event, col)">
      </div>

    </div>
  </div>

  <div class="grid-filter-row">
    <div *ngFor="let col of columns"
         class="filter-cell"
         [ngClass]="{
            'col-selection': col.type === 'selection',
            'col-avatar': col.type === 'image' || col.field === 'avatar',
            'col-action': col.type === 'action' || col.field === 'actions'
         }"
         [style.width]="col.width || '150px'">

      <input *ngIf="!col.type || col.type === 'text' || col.type === 'flag'"
             type="text"
             class="filter-input"
             [placeholder]="'جستجو ' + col.title + '...'"
             (input)="onTextInputFilter($event, col.field)"
             (click)="$event.stopPropagation()">

      <select *ngIf="col.type === 'badge'"
              class="filter-select"
              (change)="onSelectFilter($event, col.field)"
              (click)="$event.stopPropagation()">
        <option value="">همه وضعیت‌ها</option>
        <option value="Online">آنلاین (Online)</option>
        <option value="Offline">آفلاین (Offline)</option>
      </select>

      <select *ngIf="col.type === 'rate'"
              class="filter-select"
              (change)="onSelectFilter($event, col.field)"
              (click)="$event.stopPropagation()">
        <option value="">همه امتیازها</option>
        <option value="5">۵ ستاره</option>
        <option value="4">۴ ستاره</option>
        <option value="3">۳ ستاره</option>
        <option value="2">۲ ستاره</option>
        <option value="1">۱ ستاره</option>
      </select>

      <input *ngIf="col.type === 'calendar'"
             type="date"
             class="filter-date"
             (change)="onSelectFilter($event, col.field)"
             (click)="$event.stopPropagation()">

    </div>
  </div>
</div>
