openapi: 3.0.3
info:
  title: IronLogic AI - Bodybuilding Progress Tracker
  description: API for tracking daily weight, muscle measurements, and AI coaching for athletes.
  version: 1.1.0
servers:
  - url: http://localhost:5001/api/v1
    description: Local Development Server

paths:
  /progress/weight:
    post:
      summary: Log daily weight
      tags: [Progress]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyWeight'
      responses:
        '201':
          description: Weight logged successfully

  /progress/measurements:
    post:
      summary: Log muscle measurements
      tags: [Progress]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuscleMeasurement'
      responses:
        '201':
          description: Measurements logged successfully

  /workouts/stats:
    get:
      summary: Get monthly workout analytics
      tags: [Workouts]
      responses:
        '200':
          description: Monthly stats retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutStatsResponse'

  /coach/analyze:
    get:
      summary: Get AI-driven coaching advice
      tags: [Coach]
      responses:
        '200':
          description: Advice generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachAdviceResponse'

components:
  schemas:
    DailyWeight:
      type: object
      required: [date, weight]
      properties:
        date: { type: string, format: date }
        weight: { type: number, format: float, minimum: 40, maximum: 200 }
        note: { type: string, maxLength: 200 }

    MuscleMeasurement:
      type: object
      required: [date, neck, chest, waist]
      properties:
        date: { type: string, format: date }
        neck: { type: number, format: float }
        chest: { type: number, format: float }
        waist: { type: number, format: float, description: "Crucial for V-Taper" }
        bicepsLeft: { type: number, format: float }
        bicepsRight: { type: number, format: float }
        thighLeft: { type: number, format: float }
        thighRight: { type: number, format: float }

    WorkoutStatsResponse:
      type: object
      properties:
        totalVolume: { type: number, format: double }
        topExercise: { type: string }
        intensityScore: { type: number, format: double }
        sessionDate: { type: string, format: date-time }

    CoachAdviceResponse:
      type: object
      properties:
        advice: { type: string }