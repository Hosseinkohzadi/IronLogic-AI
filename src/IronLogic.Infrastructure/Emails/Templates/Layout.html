<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{Subject}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      font-family: Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f3f4f6; padding: 24px 0"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="640"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 640px;
              background: #ffffff;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="background: #111827; padding: 20px 24px; color: #ffffff"
              >
                <h1 style="margin: 0; font-size: 22px; line-height: 1.2">
                  IronLogic AI
                </h1>
                <p style="margin: 6px 0 0; font-size: 13px; color: #d1d5db">
                  Performance starts with consistency.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 24px; color: #111827">{{Body}}</td>
            </tr>
            <tr>
              <td
                style="
                  background: #f9fafb;
                  padding: 16px 24px;
                  color: #6b7280;
                  font-size: 12px;
                "
              >
                <p style="margin: 0">This message was sent by IronLogic AI.</p>
                <p style="margin: 6px 0 0">
                  Copyright {{CurrentYear}} IronLogic AI. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
