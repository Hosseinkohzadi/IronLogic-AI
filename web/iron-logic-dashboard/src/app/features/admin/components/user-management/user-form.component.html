<section class="metric-card bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
  <h4 class="text-sm font-black text-slate-900 mb-3">User Form</h4>

  @if (isLoadingUser()) {
    <div class="flex items-center gap-2 text-sm text-slate-500">
      <lucide-icon name="refresh-cw" class="h-4 w-4 animate-spin"></lucide-icon>
      Loading user details...
    </div>
  } @else {
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-3">
      <label class="block space-y-1">
        <span class="text-slate-500 text-xs">Username</span>
        <input
          formControlName="userName"
          class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900"
          placeholder="username"
        />
      </label>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <label class="block space-y-1">
          <span class="text-slate-500 text-xs">First Name</span>
          <input
            formControlName="firstName"
            class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900"
            placeholder="John"
          />
        </label>

        <label class="block space-y-1">
          <span class="text-slate-500 text-xs">Last Name</span>
          <input
            formControlName="lastName"
            class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900"
            placeholder="Doe"
          />
        </label>
      </div>

      <label class="block space-y-1">
        <span class="text-slate-500 text-xs">Email</span>
        <input
          formControlName="email"
          class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900"
          placeholder="user@ironlogic.ai"
        />
      </label>

      <label class="block space-y-1">
        <span class="text-slate-500 text-xs">Phone Number</span>
        <input
          formControlName="phoneNumber"
          class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900"
          placeholder="+12345678901"
        />
        @if (userForm.controls.phoneNumber.invalid && userForm.controls.phoneNumber.touched) {
          <span class="text-[11px] font-medium text-rose-600">Invalid phone number format.</span>
        }
      </label>

      <label class="block space-y-1">
        <span class="text-slate-500 text-xs">Profile Picture URL</span>
        <input
          formControlName="profilePictureUrl"
          class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900"
          placeholder="https://..."
        />
      </label>

      <div class="block space-y-2">
        <span class="text-slate-500 text-xs">Roles</span>
        <div class="grid grid-cols-1 gap-2 sm:grid-cols-3">
          @for (role of availableRoles; track role) {
            <label class="flex items-center justify-between rounded-lg border border-slate-200 p-2.5">
              <span class="text-xs font-medium text-slate-700">{{ role }}</span>
              <input
                type="checkbox"
                [checked]="hasRole(role)"
                (change)="toggleRole(role)"
                class="h-4 w-4 accent-indigo-600"
              />
            </label>
          }
        </div>
      </div>

      <label class="flex items-center justify-between rounded-lg border border-slate-200 p-3">
        <span class="text-slate-500 text-xs">Is Active</span>
        <input type="checkbox" formControlName="isActive" class="h-4 w-4 accent-emerald-600" />
      </label>

      @if (formError()) {
        <div
          class="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-xs font-medium text-rose-700"
        >
          {{ formError() }}
        </div>
      }

      <div class="pt-2 flex justify-end gap-2 border-t border-slate-100">
        <button
          type="button"
          (click)="cancel.emit()"
          class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50"
        >
          Cancel
        </button>

        <button
          type="submit"
          [disabled]="isSaveDisabled()"
          class="inline-flex items-center gap-2 rounded-xl px-4 py-2 text-xs font-bold text-white bg-gradient-to-r from-indigo-600 to-violet-600 enabled:hover:from-indigo-700 enabled:hover:to-violet-700 disabled:opacity-60 disabled:cursor-not-allowed"
        >
          @if (isSubmitting()) {
            <lucide-icon name="refresh-cw" class="h-3.5 w-3.5 animate-spin"></lucide-icon>
          }
          Save Changes
        </button>
      </div>
    </form>
  }
</section>
