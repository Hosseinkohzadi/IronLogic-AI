<div
  class="relative h-full min-h-[320px] w-full overflow-hidden rounded-2xl border border-indigo-100/60 bg-transparent"
>
  <svg
    [attr.viewBox]="viewBox()"
    preserveAspectRatio="xMidYMid meet"
    class="h-full w-full"
    role="img"
    aria-label="Interactive global user density map"
  >
    @if (!compactMode()) {
      @for (country of countries(); track $index) {
        <path
          [attr.d]="country.d"
          [attr.fill]="getCountryColor(country.id)"
          [class]="
            'transition-all duration-300 cursor-pointer hover:stroke-white hover:stroke-2 hover:brightness-110 ' +
            (selectedCountry() === country.id
              ? 'stroke-white stroke-2 brightness-110'
              : 'stroke-[#e2e8f0]')
          "
          (click)="onCountryClick(country.id)"
          (mouseenter)="onCountryHover($event, country.id)"
          (mousemove)="onCountryHover($event, country.id)"
          (mouseleave)="clearHover()"
        ></path>
      }
    }
  </svg>

  @for (marker of pulseMarkers; track marker.id) {
    <div
      class="pointer-events-none absolute -translate-x-1/2 -translate-y-1/2"
      [style.left]="marker.x"
      [style.top]="marker.y"
      [class.hidden]="getCountryUsers(marker.id) === 0"
    >
      <span class="absolute inset-0 h-3.5 w-3.5 rounded-full bg-indigo-400/50 animate-ping"></span>
      <span
        class="relative block h-3.5 w-3.5 rounded-full bg-indigo-500 ring-2 ring-indigo-200"
      ></span>
    </div>
  }

  @if (!compactMode() && hoveredCountry(); as countryId) {
    <div
      class="pointer-events-none absolute z-[120] -translate-x-1/2 -translate-y-full rounded-lg bg-slate-900/90 px-3 py-1.5 text-xs font-semibold text-white shadow-lg"
      [style.left.px]="tooltipPosition().x"
      [style.top.px]="tooltipPosition().y"
    >
      Country: {{ countryId }} | Users: {{ getCountryUsers(countryId) }}
    </div>
  }

  @if (!compactMode()) {
    <div
      class="pointer-events-none absolute bottom-3 left-3 rounded-xl border border-indigo-100 bg-white/90 px-3 py-2 shadow-sm backdrop-blur-sm"
    >
      <div class="flex items-center gap-3">
        @for (bin of legendBins; track bin.label) {
          <div class="flex items-center gap-1.5">
            <span class="h-2.5 w-2.5 rounded-full" [style.backgroundColor]="bin.color"></span>
            <span class="text-[10px] font-bold text-slate-500">{{ bin.label }}</span>
          </div>
        }
      </div>
    </div>
  }
</div>
