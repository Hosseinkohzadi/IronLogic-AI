<div class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
  <div
    class="w-full max-w-6xl min-h-[700px] bg-white rounded-[3rem] shadow-2xl border border-slate-900 flex overflow-hidden"
  >
    <div class="w-1/2 relative p-12 flex-col justify-between hidden lg:flex overflow-hidden">
      <div class="absolute inset-0 z-0">
        <img
          src="assets/loginImage.jpg"
          class="w-full h-full object-cover"
          alt="Workout Background"
        />
        <div class="absolute inset-0 bg-indigo-950/60 backdrop-blur-[2px]"></div>
      </div>

      <div class="relative z-10 w-full">
        <div class="flex items-center gap-3 mb-12">
          <div
            class="w-12 h-12 bg-white rounded-xl flex items-center justify-center font-black text-indigo-600 shadow-xl"
          >
            IL
          </div>
          <span class="text-2xl font-black text-white tracking-tighter uppercase"
            >IronLogic AI</span
          >
        </div>

        <h1 class="text-6xl font-black text-white leading-tight tracking-tighter italic uppercase">
          Welcome to<br />IronLogic<br />Dashboard
        </h1>
      </div>

      <div class="relative z-10">
        <p class="text-indigo-100/60 font-medium tracking-[0.2em] text-[10px] uppercase italic">
          © 2026 IronLogic AI. All rights reserved.
        </p>
      </div>
    </div>

    <div class="w-full lg:w-1/2 p-10 sm:p-16 bg-white">
      <div class="max-w-md mx-auto w-full">
        <h2 class="text-4xl font-black text-slate-950 mb-3 tracking-tighter italic uppercase">
          Login Here
        </h2>
        <p class="text-slate-500 mb-10">Login to manage your workout stats and coach AI advice.</p>

        <form class="flex flex-col gap-6" [formGroup]="loginForm" (ngSubmit)="loginWithForm()">
          @if (errorMessage()) {
            <div
              class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700"
            >
              {{ errorMessage() }}
            </div>
          }

          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"
              aria-hidden="true"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                ></path>
              </svg>
            </span>
            <input
              type="text"
              formControlName="email"
              placeholder="Username or Email"
              class="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all text-sm"
            />
          </div>

          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"
              aria-hidden="true"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                ></path>
              </svg>
            </span>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="Password"
              class="w-full pl-12 pr-12 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all text-sm"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-indigo-400 focus:outline-none transition-colors"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            >
              @if (showPassword()) {
                <lucide-icon name="eye-off" class="h-5 w-5"></lucide-icon>
              } @else {
                <lucide-icon name="eye" class="h-5 w-5"></lucide-icon>
              }
            </button>
          </div>

          <div class="text-right -mt-2">
            <a
              routerLink="/forgot"
              class="text-xs font-bold text-slate-500 hover:text-indigo-600 transition-colors uppercase tracking-wider"
            >
              Forgot Password?
            </a>
          </div>

          <button
            type="submit"
            [disabled]="isLoading()"
            class="w-full rounded-2xl py-4 text-sm font-black uppercase tracking-widest text-white transition-all"
            [class.bg-indigo-600]="!isLoading()"
            [class.hover:bg-indigo-700]="!isLoading()"
            [class.shadow-lg]="!isLoading()"
            [class.shadow-indigo-600/30]="!isLoading()"
            [class.active:scale-95]="!isLoading()"
            [class.bg-slate-400]="isLoading()"
            [class.cursor-not-allowed]="isLoading()"
          >
            {{ isLoading() ? 'Signing In...' : 'Log In' }}
          </button>
        </form>

        <div class="relative my-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200"></div>
          </div>
          <div
            class="relative flex justify-center text-[10px] uppercase font-black tracking-[0.2em] text-slate-400"
          >
            <span class="bg-white px-4">or continue with</span>
          </div>
        </div>

        <section
          class="rounded-2xl border border-slate-200 bg-slate-50 p-4"
          aria-label="Development Test Logins"
        >
          <p class="text-[11px] font-black uppercase tracking-[0.16em] text-slate-500 mb-3">
            Development / Test Logins
          </p>

          <div class="space-y-3">
            <button
              type="button"
              (click)="loginAsSuperAdmin()"
              class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-bold text-white transition-colors hover:bg-indigo-700"
            >
              Login as Super Admin
            </button>

            <button
              type="button"
              (click)="loginAsAthleteHossein()"
              class="w-full rounded-xl bg-slate-800 px-4 py-3 text-sm font-bold text-white transition-colors hover:bg-slate-900"
            >
              Login as Athlete (Hossein)
            </button>
          </div>
        </section>

        <div
          class="text-center text-[11px] text-slate-500 font-black uppercase tracking-widest mt-8"
        >
          Don't have an account?
          <a
            routerLink="/register"
            class="text-indigo-600 hover:text-indigo-700 underline underline-offset-4"
          >
            Sign Up
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
