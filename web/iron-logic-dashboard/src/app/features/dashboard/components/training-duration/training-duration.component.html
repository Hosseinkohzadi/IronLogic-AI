<div class="bg-white rounded-[2.5rem] p-6 shadow-sm border border-slate-50">
  <div class="flex flex-col gap-4 mb-6">
    <h3 class="text-sm font-black uppercase tracking-widest text-slate-400">Statistics</h3>
    
    <div class="flex justify-between items-center">
      <div class="flex gap-4 border-b border-slate-100 w-fit">
        @for (m of ['duration', 'volume', 'reps']; track m) {
          <button (click)="setMetric(m)"
                  [class.border-indigo-600]="activeMetric() === m"
                  class="pb-2 text-sm font-bold capitalize border-b-2 transition-all"
                  [class.text-indigo-600]="activeMetric() === m"
                  [class.text-slate-400]="activeMetric() !== m">
            {{ m }}
          </button>
        }
      </div>

      <select (change)="setRange($event)" 
              class="bg-slate-50 border-none rounded-xl px-4 py-2 text-xs font-bold text-slate-600 outline-none">
        <option value="12w">Last 12 weeks</option>
        <option value="year">Full Year</option>
        <option value="all">All Time</option>
      </select>
    </div>
  </div>

  <div class="mb-4">
    <h4 class="text-3xl font-black text-slate-900">
      {{ activeMetric() === 'volume' ? (chartData().values[5] | number) : chartData().values[5] }}
      <span class="text-xs text-slate-400 font-bold uppercase">
        {{ activeMetric() === 'duration' ? 'hrs' : activeMetric() === 'volume' ? 'lbs' : 'reps' }}
      </span>
    </h4>
    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Current Week Stats</p>
  </div>

  <div class="h-48 relative">
    <canvas #chartCanvas></canvas>
  </div>
</div>
