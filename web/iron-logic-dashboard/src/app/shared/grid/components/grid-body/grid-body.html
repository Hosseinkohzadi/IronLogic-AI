<div class="grid-body-container">
  <div *ngFor="let row of data$ | async"
       class="grid-row"
       [class.row-selected]="row.isSelected">

    <div *ngFor="let col of columns"
         class="grid-cell"
         [ngClass]="{
            'col-selection': col.type === 'selection',
            'col-avatar': col.type === 'image' || col.field === 'avatar',
            'col-action': col.type === 'action' || col.field === 'actions'
         }"
         [style.width]="col.width || '150px'">

      <ng-container *ngIf="col.type === 'selection'">
        <div class="flex justify-center items-center w-full">
          <input type="checkbox" [(ngModel)]="row.isSelected" (change)="onRowSelect(row)" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
        </div>
      </ng-container>

      <ng-container *ngIf="!col.type || col.type === 'text'">
        {{ row[col.field] }}
      </ng-container>

      <ng-container *ngIf="col.type === 'flag'">
        <div class="flex items-center gap-2">
          <span class="fi fi-{{ row[col.field] | lowercase }} text-lg rounded-[2px] shadow-sm"></span>
          <span class="text-xs font-bold text-slate-600 uppercase">{{ row[col.field] }}</span>
        </div>
      </ng-container>

      <ng-container *ngIf="col.type === 'badge'">
        <span class="px-2.5 py-1 text-[11px] font-bold uppercase tracking-wider rounded-md" [ngClass]="{'bg-emerald-100 text-emerald-700': row[col.field] === 'Online', 'bg-rose-100 text-rose-700': row[col.field] === 'Offline'}">
          {{ row[col.field] }}
        </span>
      </ng-container>

      <ng-container *ngIf="col.type === 'action' || col.field === 'actions'">
        <div class="action-container">
          <button (click)="onAction('edit', row)" class="action-btn edit" title="ویرایش">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button (click)="onAction('delete', row)" class="action-btn delete" title="حذف">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </ng-container>

      <ng-container *ngIf="col.type === 'image'">
        <img [src]="row[col.field]" alt="avatar" class="w-8 h-8 rounded-full object-cover border border-slate-200 shadow-sm">
      </ng-container>

      <ng-container *ngIf="col.type === 'rate'">
        <div class="flex items-center gap-0.5" dir="ltr">
          <svg *ngFor="let star of [1, 2, 3, 4, 5]" class="w-4 h-4 transition-colors" [ngClass]="star <= row[col.field] ? 'text-amber-400 fill-amber-400' : 'text-slate-200 fill-slate-50'" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
      </ng-container>

      <ng-container *ngIf="col.type === 'calendar'">
        <div class="flex items-center gap-2 text-slate-600">
          <svg class="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span class="text-xs font-semibold tracking-wide">{{ row[col.field] | date:'MMM d, y' }}</span>
        </div>
      </ng-container>

    </div>
  </div>

  <div *ngIf="(data$ | async)?.length === 0" class="no-data">داده‌ای برای نمایش یافت نشد.</div>
</div>
